name: Specification Backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Products to attempt (0 means all eligible products)"
        default: "25"
        required: true
      product:
        description: "Optional product slug for a single-product check"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-price-scrape
  cancel-in-progress: false

jobs:
  specifications:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: python database.py

      - name: Backfill cached specifications
        env:
          SPEC_LIMIT: ${{ inputs.limit }}
          SPEC_PRODUCT: ${{ inputs.product }}
        run: |
          args=(--limit "$SPEC_LIMIT")
          if [ -n "$SPEC_PRODUCT" ]; then
            args+=(--product "$SPEC_PRODUCT")
          fi
          python specs_update.py "${args[@]}"

      - name: Commit and push updated DB and cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add peengh.db static/images/products/
          git diff --cached --quiet || git commit -m "Update cached authentic phone specifications and images"
          git pull --rebase --strategy-option=theirs origin main
          git push origin main
