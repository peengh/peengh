name: Daily Price Scrape

on:
  schedule:
    # Run daily at 6:00 AM UTC (11:00 AM PKT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-price-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init DB
        run: python database.py

      - name: Update retailer prices
        env:
          STORE_FEEDS: ${{ secrets.STORE_FEEDS }}
        run: python daily_update.py

      - name: Commit and push updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add peengh.db
          git diff --cached --quiet || git commit -m "Daily price update $(date +%Y-%m-%d)"
          git push
