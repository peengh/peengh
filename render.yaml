services:
  - type: web
    name: peengh
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --preload wsgi:application
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_PATH
        value: peengh.db
      - key: SECRET_KEY
        generateValue: true
      - key: MIN_REFRESH_INTERVAL
        value: "45"
